<!--
  Canonical header markup.

  This file is the source of truth for the site header. It is NOT fetched at
  runtime — copy this block into the <body> of any new page (see README).
  Remember to move `aria-current="page"` onto the link for the new page.
-->
<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="/index.html" aria-label="Headlight Mental Healthcare — home">
      <span class="brand__mark" aria-hidden="true">H</span>
      <span class="brand__text">
        <span class="brand__name">Headlight</span>
        <span class="brand__sub">Mental Healthcare</span>
      </span>
    </a>

    <button
      class="nav-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="primary-navigation"
      aria-label="Toggle navigation menu"
    >
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
    </button>

    <nav class="nav-menu" id="primary-navigation" aria-label="Primary">
      <a class="nav-menu__link" href="/index.html">Home</a>
      <a class="nav-menu__link" href="/index.html#about">About</a>
      <a class="nav-menu__link" href="/index.html#services">Services</a>
      <a class="nav-menu__link" href="/contact.html">Contact</a>
      <a class="btn btn--primary btn--sm" href="/contact.html#book">Book Now</a>
    </nav>
  </div>
</header>
